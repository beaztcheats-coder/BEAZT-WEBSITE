<?xml version="1.0" encoding="UTF-8"?>
<!-- Abstract hero backdrop: pure UI-panel geometry, NO text elements.
     Text was removed deliberately — legible faded letters behind the hero
     headline read as a rendering bug (and duplicated stat claims). -->
<svg width="1920" height="768" viewBox="0 0 1920 768" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="768" fill="#0a0a12"/>
  <rect x="100" y="100" width="1720" height="568" fill="#0d111a" rx="16" stroke="#1e3a8a" stroke-width="2"/>

  <!-- Status bar -->
  <rect x="110" y="110" width="1700" height="40" fill="#0d111a" rx="8" stroke="#1e3a8a" stroke-width="1"/>

  <!-- Menu items -->
  <rect x="120" y="120" width="120" height="20" fill="#1e40af" rx="4"/>
  <rect x="250" y="120" width="120" height="20" fill="#1e40af" rx="4"/>
  <rect x="380" y="120" width="120" height="20" fill="#1e40af" rx="4"/>
  <rect x="510" y="120" width="120" height="20" fill="#1e40af" rx="4"/>
  <rect x="640" y="120" width="120" height="20" fill="#1e40af" rx="4"/>

  <!-- Main content area -->
  <rect x="110" y="160" width="1700" height="400" fill="#111827" rx="8"/>

  <!-- ESP feature rows -->
  <rect x="130" y="180" width="200" height="30" fill="#1e3a8a" rx="4"/>
  <rect x="130" y="220" width="200" height="30" fill="#1e3a8a" rx="4"/>
  <rect x="130" y="260" width="200" height="30" fill="#1e3a8a" rx="4"/>
  <rect x="130" y="300" width="200" height="30" fill="#1e3a8a" rx="4"/>

  <!-- Stream proof box -->
  <rect x="130" y="350" width="200" height="30" fill="#16a34a" rx="4"/>

  <!-- Operator status -->
  <rect x="130" y="390" width="200" height="30" fill="#3b82f6" rx="4"/>

  <!-- Status indicator -->
  <circle cx="200" cy="195" r="6" fill="#86efac"/>

  <!-- Feature list skeleton bars (replace old text labels) -->
  <rect x="800" y="206" width="180" height="14" fill="#1e3a8a" rx="4"/>
  <rect x="800" y="248" width="150" height="14" fill="#1e40af" rx="4"/>
  <rect x="800" y="278" width="160" height="14" fill="#1e40af" rx="4"/>
  <rect x="800" y="308" width="140" height="14" fill="#1e40af" rx="4"/>
  <rect x="800" y="338" width="170" height="14" fill="#1e40af" rx="4"/>

  <!-- Stats skeleton bars (replace old text labels) -->
  <rect x="1400" y="168" width="170" height="12" fill="#1e3a8a" rx="4"/>
  <rect x="1400" y="198" width="140" height="12" fill="#1e40af" rx="4"/>
  <rect x="1400" y="228" width="160" height="12" fill="#1e40af" rx="4"/>
  <rect x="1400" y="258" width="150" height="12" fill="#1e40af" rx="4"/>

  <!-- Accent decoration -->
  <rect x="1840" y="200" width="40" height="40" fill="#3b82f6" rx="8"/>
</svg>
